<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" role="img" aria-label="reserving-kernels benchmark latency comparison">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .title { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
      .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
      .label { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .val { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tick { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
      .grid { stroke: #21262d; stroke-width: 1; }
      .axis { stroke: #30363d; stroke-width: 1; }
      .legend { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="575" rx="10" class="bg"/>
  <text x="24" y="34" class="title">Steady-State Kernel Latency (Log Scale — Lower is Faster)</text>
  <text x="24" y="54" class="sub">Single-threaded in-process timings on Intel Core i9-14900K · rustc 1.97.0 · ChainLadder 0.2.21 (R) · chainladder-python 0.10.1</text>
  <!-- Legend -->
  <rect x="545" y="21" width="11" height="11" rx="2" fill="#f97316"/>
  <text x="562" y="31" class="legend">reserving-kernels (Rust)</text>
  <rect x="708" y="21" width="11" height="11" rx="2" fill="#38bdf8"/>
  <text x="725" y="31" class="legend">R</text>
  <rect x="752" y="21" width="11" height="11" rx="2" fill="#a78bfa"/>
  <text x="769" y="31" class="legend">Python</text>

  <line x1="248.0" y1="76" x2="248.0" y2="514" class="grid"/>
  <text x="248.0" y="532" text-anchor="middle" class="tick">0.1 µs</text>
  <line x1="319.5" y1="76" x2="319.5" y2="514" class="grid"/>
  <text x="319.5" y="532" text-anchor="middle" class="tick">1 µs</text>
  <line x1="391.0" y1="76" x2="391.0" y2="514" class="grid"/>
  <text x="391.0" y="532" text-anchor="middle" class="tick">10 µs</text>
  <line x1="462.5" y1="76" x2="462.5" y2="514" class="grid"/>
  <text x="462.5" y="532" text-anchor="middle" class="tick">100 µs</text>
  <line x1="534.0" y1="76" x2="534.0" y2="514" class="grid"/>
  <text x="534.0" y="532" text-anchor="middle" class="tick">1 ms</text>
  <line x1="605.5" y1="76" x2="605.5" y2="514" class="grid"/>
  <text x="605.5" y="532" text-anchor="middle" class="tick">10 ms</text>
  <line x1="677.0" y1="76" x2="677.0" y2="514" class="grid"/>
  <text x="677.0" y="532" text-anchor="middle" class="tick">100 ms</text>
  <line x1="748.5" y1="76" x2="748.5" y2="514" class="grid"/>
  <text x="748.5" y="532" text-anchor="middle" class="tick">1 s</text>
  <line x1="820.0" y1="76" x2="820.0" y2="514" class="grid"/>
  <text x="820.0" y="532" text-anchor="middle" class="tick">10 s</text>
  <line x1="248" y1="76" x2="248" y2="514" class="axis"/>
  <text x="236" y="111" text-anchor="end" class="label">Volume-Weighted LDFs (40×40)</text>
  <rect x="248" y="88" width="31.5" height="10" rx="2.5" fill="#f97316"/>
  <text x="285.5" y="97" class="val" fill="#fdba74">0.28 µs</text>
  <rect x="248" y="101" width="280.6" height="10" rx="2.5" fill="#38bdf8"/>
  <text x="534.6" y="110" class="val" fill="#7dd3fc">840 µs</text>
  <rect x="248" y="114" width="340.1" height="10" rx="2.5" fill="#a78bfa"/>
  <text x="594.1" y="123" class="val" fill="#c4b5fd">5.71 ms</text>
  <rect x="14" y="136" width="872" height="50" rx="5" fill="#161b22" opacity="0.55"/>
  <text x="236" y="165" text-anchor="end" class="label">Mack Chain Ladder (RAA 10×10)</text>
  <rect x="248" y="142" width="32.8" height="10" rx="2.5" fill="#f97316"/>
  <text x="286.8" y="151" class="val" fill="#fdba74">0.29 µs</text>
  <rect x="248" y="155" width="340.8" height="10" rx="2.5" fill="#38bdf8"/>
  <text x="594.8" y="164" class="val" fill="#7dd3fc">5.84 ms</text>
  <rect x="248" y="168" width="386.5" height="10" rx="2.5" fill="#a78bfa"/>
  <text x="640.5" y="177" class="val" fill="#c4b5fd">25.4 ms</text>
  <text x="236" y="219" text-anchor="end" class="label">Mack Chain Ladder (40×40)</text>
  <rect x="248" y="196" width="115.2" height="10" rx="2.5" fill="#f97316"/>
  <text x="369.2" y="205" class="val" fill="#fdba74">4.09 µs</text>
  <rect x="248" y="209" width="385.5" height="10" rx="2.5" fill="#38bdf8"/>
  <text x="639.5" y="218" class="val" fill="#7dd3fc">24.6 ms</text>
  <rect x="248" y="222" width="391.7" height="10" rx="2.5" fill="#a78bfa"/>
  <text x="645.7" y="231" class="val" fill="#c4b5fd">30.1 ms</text>
  <rect x="14" y="244" width="872" height="50" rx="5" fill="#161b22" opacity="0.55"/>
  <text x="236" y="273" text-anchor="end" class="label">Merz–Wüthrich 1-Yr CDR (RAA)</text>
  <rect x="248" y="250" width="43.7" height="10" rx="2.5" fill="#f97316"/>
  <text x="297.7" y="259" class="val" fill="#fdba74">0.41 µs</text>
  <rect x="248" y="263" width="355.6" height="10" rx="2.5" fill="#38bdf8"/>
  <text x="609.6" y="272" class="val" fill="#7dd3fc">9.42 ms</text>
  <text x="254" y="285" class="val" fill="#6e7681">n/a</text>
  <text x="236" y="327" text-anchor="end" class="label">Clark Loglogistic MLE (GenIns)</text>
  <rect x="248" y="304" width="148.5" height="10" rx="2.5" fill="#f97316"/>
  <text x="402.5" y="313" class="val" fill="#fdba74">11.9 µs</text>
  <rect x="248" y="317" width="351.7" height="10" rx="2.5" fill="#38bdf8"/>
  <text x="605.7" y="326" class="val" fill="#7dd3fc">8.30 ms</text>
  <rect x="248" y="330" width="363.2" height="10" rx="2.5" fill="#a78bfa"/>
  <text x="617.2" y="339" class="val" fill="#c4b5fd">12.0 ms</text>
  <rect x="14" y="352" width="872" height="50" rx="5" fill="#161b22" opacity="0.55"/>
  <text x="236" y="381" text-anchor="end" class="label">ODP GLM Reserve (GenIns)</text>
  <rect x="248" y="358" width="188.0" height="10" rx="2.5" fill="#f97316"/>
  <text x="442.0" y="367" class="val" fill="#fdba74">42.6 µs</text>
  <rect x="248" y="371" width="337.8" height="10" rx="2.5" fill="#38bdf8"/>
  <text x="591.8" y="380" class="val" fill="#7dd3fc">5.30 ms</text>
  <rect x="248" y="384" width="453.4" height="10" rx="2.5" fill="#a78bfa"/>
  <text x="707.4" y="393" class="val" fill="#c4b5fd">220 ms</text>
  <text x="236" y="435" text-anchor="end" class="label">ODP Bootstrap (GenIns, 1k sims)</text>
  <rect x="248" y="412" width="279.2" height="10" rx="2.5" fill="#f97316"/>
  <text x="533.2" y="421" class="val" fill="#fdba74">0.80 ms</text>
  <rect x="248" y="425" width="453.0" height="10" rx="2.5" fill="#38bdf8"/>
  <text x="707.0" y="434" class="val" fill="#7dd3fc">216 ms</text>
  <rect x="248" y="438" width="420.8" height="10" rx="2.5" fill="#a78bfa"/>
  <text x="674.8" y="447" class="val" fill="#c4b5fd">76.8 ms</text>
  <rect x="14" y="460" width="872" height="50" rx="5" fill="#161b22" opacity="0.55"/>
  <text x="236" y="489" text-anchor="end" class="label">ODP Bootstrap (GenIns, 10k sims)</text>
  <rect x="248" y="466" width="351.3" height="10" rx="2.5" fill="#f97316"/>
  <text x="605.3" y="475" class="val" fill="#fdba74">8.20 ms</text>
  <rect x="248" y="479" width="525.3" height="10" rx="2.5" fill="#38bdf8"/>
  <text x="779.3" y="488" class="val" fill="#7dd3fc">2,223 ms</text>
  <rect x="248" y="492" width="473.3" height="10" rx="2.5" fill="#a78bfa"/>
  <text x="727.3" y="501" class="val" fill="#c4b5fd">416 ms</text>
  <text x="24" y="564" class="sub">Note: reserving-kernels operates on flat f64 slices; R ChainLadder and chainladder-python include S3/S4 or 4D DataFrame metadata overhead.</text>
</svg>
