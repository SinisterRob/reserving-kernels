name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features, forbid unsafe_code)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (library panic/unwrap-free gate)
        run: cargo clippy --lib --all-features -- -D warnings -D clippy::unwrap_used -D clippy::panic

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test --all-targets --no-default-features
      - name: Test (all features)
        run: cargo test --all-targets --all-features
      - name: Doctests
        run: cargo test --doc --all-features
      - name: Example smoke test
        shell: bash
        run: cargo run --example export_exhibit > /dev/null

  msrv:
    name: MSRV (1.98)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.98
      - name: Check library, tests, and examples (default features)
        run: cargo check --lib --tests --examples --no-default-features
      - name: Check library, tests, and examples (all features)
        run: cargo check --lib --tests --examples --all-features
      - name: Unit tests on MSRV
        run: cargo test --lib

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs with warnings denied
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm32 release binary
        run: cargo build --release --target wasm32-unknown-unknown --features wasm
      - name: Smoke-test WASM C-ABI exports
        run: node scripts/wasm-smoke.mjs target/wasm32-unknown-unknown/release/reserving_kernels.wasm

  package:
    name: Package & Bench Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify crate packaging
        run: cargo package
      - name: Check release benchmarks compile
        run: cargo check --benches --release

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, clippy, test, msrv, docs, wasm, package]
    steps:
      - name: Verify all required CI jobs succeeded
        shell: bash
        env:
          RESULTS: >-
            fmt=${{ needs.fmt.result }}
            clippy=${{ needs.clippy.result }}
            test=${{ needs.test.result }}
            msrv=${{ needs.msrv.result }}
            docs=${{ needs.docs.result }}
            wasm=${{ needs.wasm.result }}
            package=${{ needs.package.result }}
        run: |
          failed=0
          for item in $RESULTS; do
            echo "$item"
            if [[ "$item" != *=success ]]; then
              failed=1
            fi
          done
          exit "$failed"
