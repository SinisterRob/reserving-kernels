name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features, forbid unsafe_code)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (library panic/unwrap/expect-free gate)
        run: cargo clippy --lib --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test --all-targets --no-default-features
      - name: Test (all features)
        run: cargo test --all-targets --all-features
      - name: Doctests
        run: cargo test --doc --all-features
      - name: Example smoke test
        shell: bash
        run: cargo run --example export_exhibit > /dev/null

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.97
      - name: Check library, tests, and examples (default features)
        run: cargo check --lib --tests --examples --no-default-features
      - name: Check library, tests, and examples (all features)
        run: cargo check --lib --tests --examples --all-features
      - name: Unit tests on MSRV
        run: cargo test --lib

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs with warnings denied
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm32 release binary
        run: cargo build --release --target wasm32-unknown-unknown --features wasm
      - name: Smoke-test WASM C-ABI exports
        run: node scripts/wasm-smoke.mjs target/wasm32-unknown-unknown/release/reserving_kernels.wasm

  xll:
    name: Excel XLL (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/xll
      - run: cargo fmt --manifest-path bindings/xll/Cargo.toml -- --check
      - run: cargo clippy --manifest-path bindings/xll/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path bindings/xll/Cargo.toml
      - name: Build Excel add-in
        run: |
          cargo build --manifest-path bindings/xll/Cargo.toml --release
          Copy-Item bindings/xll/target/release/reserving_kernels_xll.dll reserving-kernels-windows-x64.xll
      - uses: actions/upload-artifact@v7
        with:
          name: reserving-kernels-windows-x64
          path: reserving-kernels-windows-x64.xll
          if-no-files-found: error

  security:
    name: Security & Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
      - name: Lint hooks and shell scripts
        run: shellcheck .githooks/* scripts/*.sh
      - name: Syntax-check Python and Node scripts
        run: |
          shopt -s nullglob
          for py in scripts/*.py; do
            python3 -m py_compile "$py"
          done
          for js in scripts/*.mjs scripts/*.js; do
            node --check "$js"
          done
      - name: Verify README version matches Cargo.toml
        run: |
          python3 - <<'PY'
          import re, sys, tomllib
          pkg = tomllib.load(open("Cargo.toml", "rb"))["package"]
          name, ver = pkg["name"], pkg["version"]
          major_minor = ".".join(ver.split(".")[:2])
          readme = open("README.md", encoding="utf-8").read()
          m = re.search(rf'^{re.escape(name)}\s*=\s*"([^"]+)"', readme, re.MULTILINE)
          if not m:
              sys.exit(f'ERROR: README.md missing `{name} = "{major_minor}"` dependency snippet')
          found = m.group(1)
          if found not in (major_minor, ver):
              sys.exit(f'ERROR: README.md has `{name} = "{found}"`, expected "{major_minor}" or "{ver}" (Cargo.toml={ver})')
          print(f'OK: README.md `{name} = "{found}"` matches Cargo.toml {ver}')
          PY

  package:
    name: Package & Bench Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify crate packaging
        run: cargo package
      - name: Check release benchmarks compile
        run: cargo check --benches --release

  miri:
    name: Miri (FFI & UB Check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-nightly
      - name: Run Miri on WASM C-ABI FFI & invariant tests
        run: cargo +nightly miri test --test tightening_invariants --features wasm wasm_c_abi_exports_roundtrip_and_clear_buffers_on_invalid_input layer_spec_unifies_attachment_limit_and_attachment_top_conventions swimon_does_not_panic_on_tiny_concave_rounding_slack malformed_views_and_grids_return_err_without_panicking

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [fmt, clippy, test, msrv, docs, wasm, xll, security, package, miri]
    steps:
      - name: Verify all required CI jobs succeeded
        shell: bash
        env:
          RESULTS: >-
            fmt=${{ needs.fmt.result }}
            clippy=${{ needs.clippy.result }}
            test=${{ needs.test.result }}
            msrv=${{ needs.msrv.result }}
            docs=${{ needs.docs.result }}
            wasm=${{ needs.wasm.result }}
            xll=${{ needs.xll.result }}
            security=${{ needs.security.result }}
            package=${{ needs.package.result }}
            miri=${{ needs.miri.result }}
        run: |
          failed=0
          for item in $RESULTS; do
            echo "$item"
            if [[ "$item" != *=success ]]; then
              failed=1
            fi
          done
          exit "$failed"
