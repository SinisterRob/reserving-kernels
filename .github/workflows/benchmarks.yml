name: Benchmarks (theliomira)

# Public-repo security invariant: NEVER trigger this self-hosted runner workflow
# on `pull_request` or `pull_request_target` events. Only trusted pushes to `main`
# and explicit maintainer `workflow_dispatch` runs execute on `theliomira`.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - src/**
      - benches/**
      - scripts/bench-report.py
      - .github/workflows/benchmarks.yml
  workflow_dispatch:
    inputs:
      filter:
        description: "Optional Criterion regex filter (blank runs full kernels suite)"
        required: false
        default: ""
        type: string
      threshold_pct:
        description: "Median latency regression warning threshold (%)"
        required: false
        default: "15"
        type: string
      fail_on_regression:
        description: "Fail the workflow if any benchmark exceeds the regression threshold"
        required: false
        default: false
        type: boolean
      refresh_assets:
        description: "Open a PR with refreshed baseline JSON, assets/benchmarks.svg, and README.md"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmarks-theliomira
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Criterion on theliomira (i9-14900K)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, theliomira]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Record host and toolchain info
        shell: bash
        run: |
          echo "Host: $(hostname)"
          echo "CPU:  $(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/, "", $2); print $2; exit}')"
          echo "Rust: $(rustc --version)"
          echo "SHA:  $(git rev-parse --short HEAD)"

      - name: Run Criterion benchmarks
        shell: bash
        env:
          BENCH_FILTER: ${{ inputs.filter || '' }}
        run: |
          if [ -n "$BENCH_FILTER" ]; then
            cargo bench --bench kernels -- --noplot "$BENCH_FILTER"
          else
            cargo bench --bench kernels -- --noplot
          fi

      - name: Compare against i9-14900K baseline and render SVG
        shell: bash
        env:
          THRESHOLD_PCT: ${{ inputs.threshold_pct || '15' }}
          FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression || false }}
          REFRESH_ASSETS: ${{ inputs.refresh_assets || false }}
          BENCH_FILTER: ${{ inputs.filter || '' }}
        run: |
          ARGS=(
            --criterion-dir "${CARGO_TARGET_DIR:-target}/criterion"
            --baseline benches/baseline-i9-14900k.json
            --threshold "$THRESHOLD_PCT"
            --github-summary
            --json-out bench-report.json
          )
          if [ "$FAIL_ON_REGRESSION" = "true" ]; then
            ARGS+=(--fail-on-regression)
          fi
          if [ "$REFRESH_ASSETS" = "true" ] && [ -z "$BENCH_FILTER" ]; then
            ARGS+=(
              --update-baseline
              --render-svg assets/benchmarks.svg
              --update-readme README.md
            )
          else
            ARGS+=(--render-svg bench-chart.svg)
          fi
          python3 scripts/bench-report.py "${ARGS[@]}"

      - name: Open PR with refreshed benchmark assets
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_assets && inputs.filter == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/bench-refresh-${{ github.run_id }}
        run: |
          if git diff --quiet benches/baseline-i9-14900k.json assets/benchmarks.svg README.md; then
            echo "No benchmark asset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add benches/baseline-i9-14900k.json assets/benchmarks.svg README.md
          git commit -m "chore(bench): refresh i9-14900K baseline, SVG chart, and README"
          git push origin "HEAD:${BRANCH}"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(bench): refresh i9-14900K baseline, SVG chart, and README" \
            --body "Automated benchmark asset refresh from workflow run \`${{ github.run_id }}\` on \`theliomira\` (Intel Core i9-14900K)."

      - name: Upload benchmark report and SVG artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-report-theliomira-${{ github.run_id }}
          path: |
            bench-report.json
            bench-chart.svg
            assets/benchmarks.svg
          retention-days: 30
          if-no-files-found: ignore
