[package]
name = "reserving-kernels"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Robert Jurgens, FCAS <robertdjurgens@gmail.com>"]
description = "Pure Rust numeric kernels for P&C actuarial reserving, pricing, and capital modeling."
license = "MIT OR Apache-2.0"
repository = "https://github.com/SinisterRob/reserving-kernels"
homepage = "https://sinisterrob.github.io"
readme = "README.md"
exclude = ["assets/", ".github/", ".githooks/", "scripts/"]
keywords = ["actuarial", "reserving", "chain-ladder", "bootstrap", "insurance"]
categories = ["mathematics", "science", "simulation"]

[lib]
name = "reserving_kernels"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "triangle_algebra"
harness = false

[[bench]]
name = "kernels"
harness = false
